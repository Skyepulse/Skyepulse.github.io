<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyegrid Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #000;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            z-index: 10;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #404040;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 18px;
        }
        
        .error-text {
            color: #f87171;
            margin-top: 16px;
            font-size: 14px;
        }
        
        /* Canvas */
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* Control Buttons */
        .controls {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 20;
            display: flex;
            gap: 8px;
        }
        
        .control-btn {
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .control-btn svg {
            width: 20px;
            height: 20px;
        }
        
        /* Controls Help */
        .controls-help {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 20;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-family: monospace;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .controls-help:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">Loading Skyegrid... <span id="progress">0</span>%</p>
            <p class="error-text" id="error" style="display: none;"></p>
        </div>

        <!-- Canvas -->
        <canvas id="canvas" oncontextmenu="return false;"></canvas>

        <!-- Control Buttons -->
        <div class="controls">
            <button class="control-btn" onclick="goBack()" title="Close">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Controls Help -->
        <div class="controls-help">
            <p>WASD - Move | Space/Shift - Up/Down | Q/E - Rotate</p>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const canvas = document.getElementById('canvas');
        const loadingOverlay = document.getElementById('loading');
        const progressEl = document.getElementById('progress');
        const errorEl = document.getElementById('error');
        
        let moduleInstance = null;

        function resizeCanvas() {
            if (canvas && container) {
                const width = container.clientWidth;
                const height = container.clientHeight;
                canvas.width = width;
                canvas.height = height;
                console.log('[Skyegrid] Canvas resized to:', width, 'x', height);
            }
        }

        function goBack() {
            if (document.fullscreenElement) {
                document.exitFullscreen().then(() => {
                    window.history.back();
                });
            } else {
                window.history.back();
            }
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }

        async function initModule() {
            console.log('[Skyegrid] Initializing module...');
            console.log('[Skyegrid] Canvas size:', canvas.width, 'x', canvas.height);
            
            try {
                // Register the canvas in Emscripten's specialHTMLTargets
                if (!self.specialHTMLTargets) {
                    self.specialHTMLTargets = { 0: 0 };
                }
                self.specialHTMLTargets['!canvas'] = canvas;
                self.specialHTMLTargets['#canvas'] = canvas;
                
                moduleInstance = await window.createSkyegridModule({
                    canvas: canvas,
                    locateFile: function(path) {
                        const fullPath = '/projects/skyegrid/' + path;
                        console.log('[Skyegrid] locateFile:', path, '->', fullPath);
                        return fullPath;
                    },
                    setStatus: function(text) {
                        console.log('[Skyegrid] Status:', text);
                        if (text) {
                            const downloadMatch = text.match(/Downloading.*\((\d+)\/(\d+)\)/);
                            if (downloadMatch) {
                                progressEl.textContent = Math.round(100 * parseInt(downloadMatch[1]) / parseInt(downloadMatch[2]));
                                return;
                            }
                            const match = text.match(/(\d+)\/(\d+)/);
                            if (match) {
                                progressEl.textContent = Math.round(100 * parseInt(match[1]) / parseInt(match[2]));
                            }
                        }
                    },
                    onRuntimeInitialized: function() {
                        console.log('[Skyegrid] Runtime initialized!');
                        hideLoading();
                        resizeCanvas();
                    },
                    monitorRunDependencies: function(left) {
                        console.log('[Skyegrid] Dependencies remaining:', left);
                        if (left === 0) {
                            hideLoading();
                        }
                    }
                });
                
                console.log('[Skyegrid] Module created successfully');
                
            } catch (error) {
                console.error('[Skyegrid] Module init error:', error);
                showError(error.message || 'Failed to initialize');
            }
        }

        async function loadSkyegrid() {
            try {
                console.log('[Skyegrid] Starting load...');
                
                if (!canvas) {
                    showError('Canvas element not found');
                    return;
                }

                // Check if already loaded
                if (typeof window.createSkyegridModule === 'function') {
                    console.log('[Skyegrid] Module already loaded, initializing...');
                    await initModule();
                    return;
                }

                console.log('[Skyegrid] Loading script...');
                
                const script = document.createElement('script');
                script.src = '/projects/skyegrid/Skyegrid.js';
                
                await new Promise((resolve, reject) => {
                    script.onload = () => {
                        console.log('[Skyegrid] Script loaded successfully');
                        resolve();
                    };
                    script.onerror = (e) => {
                        console.error('[Skyegrid] Script failed to load', e);
                        reject(new Error('Failed to load Skyegrid.js'));
                    };
                    document.body.appendChild(script);
                });

                // Wait for script to execute
                await new Promise(resolve => setTimeout(resolve, 50));

                if (!window.createSkyegridModule) {
                    throw new Error('createSkyegridModule not defined after script load');
                }

                console.log('[Skyegrid] createSkyegridModule is available');
                await initModule();
                
            } catch (error) {
                console.error('[Skyegrid] Load error:', error);
                showError(error.message || 'Unknown error');
            }
        }

        // Initialize
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        loadSkyegrid();
    </script>
</body>
</html>
